[project]
name = "spotify-analysis-backend"
version = "0.1.0"
description = "FastAPI backend for Spotify Playlist Vibe Splitter & Analyzer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "litellm>=1.34.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.5",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
]

[tool.uv]
package = false
